<title>Cuaderno Azul Chat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width chat column, cover-navy header, kraft-paper chat ground (from the product photo). */
:root {
  --navy: #1b2f5e;
  --navy-ink: #f3ece0;
  --ground: #ece2d2;
  --ground-dots: #ddd0bb;
  --bubble-in: #fffdf8;
  --bubble-out: #d9e2f3;
  --fg: #1d2333;
  --muted: #6b6a73;
  --line: #d6cab6;
  --btn: #ffffff;
  --btn-fg: #24447f;
  --owner: #2f6b4f;
  --shell: #e4dccd;
  --font-brand: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #14234a; --navy-ink: #efe6d6; --ground: #10172a; --ground-dots: #172038;
    --bubble-in: #1d2741; --bubble-out: #2a3f6e; --fg: #e9e6ee; --muted: #9aa0b4;
    --line: #2a3553; --btn: #1d2741; --btn-fg: #a9c1f2; --owner: #6fc39b; --shell: #0b1020;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --navy: #14234a; --navy-ink: #efe6d6; --ground: #10172a; --ground-dots: #172038;
  --bubble-in: #1d2741; --bubble-out: #2a3f6e; --fg: #e9e6ee; --muted: #9aa0b4;
  --line: #2a3553; --btn: #1d2741; --btn-fg: #a9c1f2; --owner: #6fc39b; --shell: #0b1020;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--shell); color: var(--fg); font-family: var(--font-body); font-size: 15px;
  display: flex; justify-content: center;
}
.app {
  width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column;
  background: var(--ground); position: relative; overflow: hidden;
}
@media (min-width: 520px) { .app { box-shadow: 0 0 0 1px var(--line); } }

header {
  background: var(--navy); color: var(--navy-ink);
  padding-block: 10px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px;
}
.who { display: flex; align-items: center; gap: 12px; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; flex: none; overflow: hidden;
  background: var(--navy-ink); border: 1px solid color-mix(in srgb, var(--navy-ink) 40%, transparent);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.who-text { min-width: 0; flex: 1; }
.who-name { font-family: var(--font-brand); font-size: 16px; font-weight: 500; letter-spacing: 0.02em; }
.who-sub { font-size: 12.5px; opacity: 0.75; }
.reset {
  font: inherit; font-size: 13px; color: var(--navy-ink); background: transparent; cursor: pointer;
  border: 1px solid color-mix(in srgb, var(--navy-ink) 45%, transparent); border-radius: 999px; padding: 6px 12px;
}
.tabs { display: flex; }
.tab {
  flex: 1; font: inherit; font-size: 14px; font-weight: 600; color: var(--navy-ink); opacity: 0.6;
  background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 4px 9px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.tab[aria-selected="true"] { opacity: 1; border-bottom-color: var(--navy-ink); }
.badge {
  min-width: 20px; height: 20px; border-radius: 10px; padding: 0 6px; font-size: 12px; line-height: 20px;
  background: var(--owner); color: #fff;
}
:focus-visible { outline: 2px solid var(--btn-fg); outline-offset: 2px; }
header :focus-visible { outline-color: var(--navy-ink); }

.chat {
  flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
  padding-block: 14px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  background-color: var(--ground);
  background-image: radial-gradient(var(--ground-dots) 1px, transparent 1.2px);
  background-size: 22px 22px;
}
.note {
  align-self: center; text-align: center; font-size: 12.5px; color: var(--muted); max-width: 34ch;
  background: var(--bubble-in); border-radius: 8px; padding: 6px 10px; margin-block: 4px 8px;
}
.msg { display: flex; flex-direction: column; max-width: 84%; gap: 4px; }
.msg.in { align-self: flex-start; }
.msg.out { align-self: flex-end; }
.bubble {
  background: var(--bubble-in); border-radius: 4px 12px 12px 12px; padding: 8px 10px 6px;
  line-height: 1.42; white-space: pre-wrap; overflow-wrap: anywhere;
  box-shadow: 0 1px 0 color-mix(in srgb, var(--fg) 10%, transparent);
}
.msg.out .bubble { background: var(--bubble-out); border-radius: 12px 4px 12px 12px; }
.bubble img { display: block; border-radius: 8px; margin: -4px -6px 8px; max-width: calc(100% + 12px); }
.bubble a { color: var(--btn-fg); }
.time { display: block; text-align: right; font-size: 11px; color: var(--muted); margin-top: 2px; }
.receipt {
  width: 150px; height: 90px; border-radius: 8px; margin-bottom: 4px;
  background: repeating-linear-gradient(0deg, color-mix(in srgb, var(--fg) 8%, transparent) 0 8px, transparent 8px 16px), var(--bubble-in);
  display: grid; place-items: center; font-size: 13px; color: var(--muted);
}
.btns { display: flex; flex-direction: column; gap: 4px; }
.btns button {
  font: inherit; font-weight: 600; font-size: 14.5px; color: var(--btn-fg); background: var(--btn);
  border: 0; border-radius: 10px; padding: 10px; cursor: pointer;
  box-shadow: 0 1px 0 color-mix(in srgb, var(--fg) 10%, transparent);
}
.btns button:disabled { opacity: 0.55; cursor: default; }
.list-head {
  display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; color: var(--btn-fg);
  border-top: 1px solid var(--line); margin: 8px -10px -6px; padding: 9px 10px 7px; font-size: 14.5px;
}
.btns.rows button { text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 9px 12px; }
.btns.rows .r-title { color: var(--fg); font-weight: 600; }
.btns.rows .r-desc { color: var(--muted); font-weight: 400; font-size: 13px; line-height: 1.3; }
.btns.rows button.pick { box-shadow: 0 0 0 2px var(--btn-fg); }
.tpl-tag { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; margin-bottom: 4px; }
.typing { align-self: flex-start; background: var(--bubble-in); border-radius: 12px; padding: 10px 14px; display: flex; gap: 4px; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing span:nth-child(2) { animation-delay: .15s } .typing span:nth-child(3) { animation-delay: .3s }
@keyframes blink { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .6; } }

.hints {
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  padding-block: 8px 0;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.hints button {
  flex: none; font: inherit; font-size: 13px; color: var(--fg); background: var(--bubble-in);
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; cursor: pointer;
}
form.compose {
  display: flex; gap: 8px; align-items: center;
  padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px));
  padding-left: max(10px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
}
.compose input {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--fg); background: var(--bubble-in);
  border: 1px solid var(--line); border-radius: 22px; padding: 10px 14px;
}
.icon-btn {
  flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
  display: grid; place-items: center; font-size: 18px;
}
.icon-btn.photo { background: var(--bubble-in); color: var(--fg); border: 1px solid var(--line); }
.icon-btn.send { background: var(--navy); color: var(--navy-ink); }
.icon-btn svg { width: 20px; height: 20px; }
</style>

<script>
/* ---- Bot code: generated from src/messages.js and src/flow.js by scripts/build-demo.js ---- */
// Volume pricing: the more notebooks, the lower the price per notebook.
// Tiers come from PRICE_TIERS, e.g. "1:15" (or "1:15,5:13" for a bulk price from 5)

const round = (n) => Math.round(n * 100) / 100;

const parseTiers = (spec) =>
  spec
    .split(',')
    .map((part) => part.split(':').map(Number))
    .filter(([min, unit]) => min >= 1 && unit > 0)
    .map(([min, unit]) => ({ min, unit }))
    .sort((a, b) => a.min - b.min);

const unitPrice = (qty, cfg) => {
  let unit = cfg.pricing[0].unit;
  for (const t of cfg.pricing) if (qty >= t.min) unit = t.unit;
  return unit;
};

const hasFreeShipping = (qty, cfg) => cfg.freeShippingFrom > 0 && qty >= cfg.freeShippingFrom;

// Full price breakdown for a quantity and delivery method.
function quote(qty, method, cfg) {
  const unit = unitPrice(qty, cfg);
  const subtotal = round(unit * qty);
  const savings = round(cfg.pricing[0].unit * qty - subtotal);
  const shipping = method === 'delivery' && !hasFreeShipping(qty, cfg) ? cfg.shippingCost : 0;
  return { qty, unit, subtotal, savings, shipping, total: round(subtotal + shipping) };
}

// Subscription plans. "club" = pay each delivery; "annual" = pay one year upfront.
// Savings are measured against buying one notebook with delivery each time.
function planQuote(plan, months, cfg) {
  const s = cfg.subscription;
  const singleDelivered = quote(1, 'delivery', cfg).total;
  if (plan === 'club') {
    return { plan, months, deliveries: 1, unit: s.clubPrice, total: s.clubPrice, savings: round(singleDelivered - s.clubPrice) };
  }
  const deliveries = Math.round(12 / months);
  const total = round(s.annualPrice * deliveries);
  return { plan, months, deliveries, unit: s.annualPrice, total, savings: round(singleDelivered * deliveries - total) };
}

// Subscription date helpers (pure functions, no I/O).
// Dates are plain 'YYYY-MM-DD' strings in Ecuador time.

const todayEC = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Guayaquil' });

// Same day N months later; clamps to the month's last day (Jan 31 + 1 month = Feb 28/29).
function addMonths(isoDate, months) {
  const [y, m, d] = isoDate.split('-').map(Number);
  const target = new Date(Date.UTC(y, m - 1 + months, 1));
  const lastDay = new Date(Date.UTC(target.getUTCFullYear(), target.getUTCMonth() + 1, 0)).getUTCDate();
  target.setUTCDate(Math.min(d, lastDay));
  return target.toISOString().slice(0, 10);
}

const daysUntil = (from, to) => Math.round((Date.parse(to) - Date.parse(from)) / 86400000);

// Active subscriptions whose next delivery is close and that weren't reminded for it yet.
const dueForReminder = (subs, today, daysBefore) =>
  subs.filter(
    (s) => s.status === 'active' && s.remindedFor !== s.nextShipDate && daysUntil(today, s.nextShipDate) <= daysBefore
  );

const freqLabel = (months) => (months === 1 ? 'cada mes' : `cada ${months} meses`);
const planName = (plan) => (plan === 'annual' ? 'Plan Anual' : 'Club Azul');

const formatDate = (isoDate) =>
  new Date(isoDate + 'T12:00:00Z').toLocaleDateString('es-EC', { day: 'numeric', month: 'long', timeZone: 'UTC' });

// Every text the bot sends. Edit freely to match your brand voice.
// WhatsApp limits: max 3 buttons per message, button titles max 20 characters.
// Why each message is written this way: docs/09-estrategia.md




const $ = (n) => `$${Number(n).toFixed(2)}`;
const $short = (n) => (Number.isInteger(Number(n)) ? `$${Number(n)}` : $(n)); // "$15" instead of "$15.00" in tight spots

const plain = (text) => ({ type: 'text', text });

const buttons = (text, list, headerImage) => ({
  type: 'buttons',
  text,
  buttons: list.map(([id, title]) => ({ id, title })),
  ...(headerImage ? { headerImage } : {}),
});

const cuadernos = (n) => (n === 1 ? '1 cuaderno' : `${n} cuadernos`);
const firstName = (name = '') => name.split(' ')[0];

// ---------- 1. Offer: one decision, "yes" ----------

const productOffer = (cfg) =>
  buttons(
    `¡Hola! 💙 Este es *${cfg.product.name}*\n` +
      `${cfg.product.description}\n\n` +
      `💵 *${$(cfg.product.price)}*\n` +
      `🚚 Envío a todo Ecuador o retiro GRATIS en tienda`,
    [
      ['yes', '¡Lo quiero! 😍'],
      ['question', 'Tengo una pregunta'],
    ],
    cfg.product.imageUrl || undefined
  );

// ---------- 2. The upsell: right after "yes", one message, 3 options ----------
// One-time purchase (any quantity) · Club (target, in the middle) · Annual (anchor, biggest saving)

const planOffer = (cfg, retry = false) => {
  const months = cfg.subscription.defaultMonths;
  const club = planQuote('club', months, cfg);
  const annual = cfg.subscription.annualPrice > 0 ? planQuote('annual', months, cfg) : null;
  const lines = [
    retry ? 'Toca una opción 👇' : '¡Buenísimo! 🙌 Antes de tus datos, mira esto 👀',
    '',
    `🛍️ *Compra única*: ${$short(cfg.product.price)} c/u (+ ${$(cfg.shippingCost)} de envío` +
      (cfg.freeShippingFrom ? `, gratis desde ${cfg.freeShippingFrom})` : ')'),
    '',
    `⭐ *Club Azul*: uno nuevo ${freqLabel(months)} a *${$short(club.unit)}*, envío GRATIS.`,
    `Ahorras ${$short(club.savings)} en cada envío y cancelas cuando quieras.`,
  ];
  const opts = [
    ['plan_single', `Comprar · ${$short(cfg.product.price)} c/u`],
    ['plan_club', `⭐ Club · ${$short(club.unit)} c/u`],
  ];
  if (annual) {
    lines.push(
      '',
      `💎 *Anual*: ${cuadernos(annual.deliveries)} por *${$short(annual.total)}* (${$short(annual.unit)} c/u), un solo pago, envío GRATIS.`,
      `*Ahorras ${$short(annual.savings)}* en el año.`
    );
    opts.push(['plan_annual', `💎 Anual · ${$short(annual.total)}`]);
  }
  return buttons(lines.join('\n'), opts);
};

const wholesale = (qty) =>
  plain(
    `¡Wow, ${cuadernos(qty)}! 🤩 Para pedidos grandes te hacemos *precio mayorista*.\n` +
      'Una persona de nuestro equipo te escribe en breve por aquí 🙌\n\n(Escribe *reiniciar* para volver al menú)'
  );

// ---------- 3. Data: address (or pickup) -> name -> cédula ----------

const askAddress = (order, cfg, retry = false) => {
  const isSub = order.kind === 'subscription';
  const freeShip = isSub || hasFreeShipping(order.qty, cfg);
  const text =
    (retry ? 'Necesito un poquito más de detalle 🙏\n\n' : '') +
    '📍 ¿A dónde te lo enviamos?\n' +
    'Escribe tu *ciudad y dirección* en un mensaje.\n' +
    '_Ej: Quito, Av. Amazonas N34 y Rusia, casa azul frente al parque_\n\n' +
    (freeShip
      ? `🚚 Envío LAAR *GRATIS* · ${cfg.deliveryDays}`
      : `🚚 Envío LAAR ${$(cfg.shippingCost)} · ${cfg.deliveryDays}\n🏬 O retíralo *GRATIS* en nuestra tienda 👇`);
  return isSub ? plain(text) : buttons(text, [['pickup', '🏬 Prefiero retirar']]);
};

// Returning customer: one tap instead of typing everything again.
const askSameAddress = (customer, order) =>
  buttons(`¿Te lo enviamos a la misma dirección? 📍\n${customer.address}`, [
    ['same_address', '✅ Sí, a esa'],
    ['other_address', 'Otra dirección'],
    ...(order.kind === 'subscription' ? [] : [['pickup', '🏬 Prefiero retirar']]),
  ]);

// WhatsApp gives us the profile name: confirming it is one tap.
const askNameConfirm = (profileName) =>
  buttons(`¿El pedido va a nombre de *${profileName}*?`, [
    ['name_ok', '✅ Sí'],
    ['name_other', 'Otro nombre'],
  ]);

const askName = (retry = false) =>
  plain(retry ? 'Escríbeme tu nombre y apellido, porfa 🙏' : '¿A nombre de quién va? (nombre y apellido)');

const askCedula = (retry = false) =>
  plain(
    retry
      ? 'Mmm, eso no parece una cédula. Escribe los 10 dígitos (o 13 si es RUC) 🙏'
      : '🪪 Tu número de cédula, porfa (LAAR lo pide para la guía).'
  );

// ---------- 4. Summary ----------

const customerLines = (order, cfg) => {
  const who = `👤 ${order.name}${order.cedula ? ` · ${order.cedula}` : ''}`;
  return order.method === 'pickup'
    ? [who, `🏬 Retiras en: ${cfg.store.address}`, `🕒 ${cfg.store.hours}`, `🗺️ ${cfg.store.mapsUrl}`]
    : [who, `📍 ${order.address}`];
};

const summary = (order, cfg) => {
  const isSub = order.kind === 'subscription';
  const lines = [];
  if (isSub) {
    const p = planQuote(order.plan, order.months, cfg);
    lines.push(`📝 *Tu ${planName(order.plan)}*`, '');
    if (order.plan === 'annual') {
      lines.push(
        `📅 ${cuadernos(p.deliveries)}, uno ${freqLabel(p.months)}`,
        `💵 ${$(p.total)} (${$(p.unit)} c/u), envío incluido`,
        `🎉 Ahorras ${$(p.savings)}`
      );
    } else {
      lines.push(`📅 1 cuaderno ${freqLabel(p.months)}`, `💵 ${$(p.unit)} por envío, envío incluido`);
    }
    lines.push('🚚 El primero sale apenas confirmes el pago', `*Hoy pagas: ${$(p.total)}*`);
  } else {
    const q = quote(order.qty, order.method, cfg);
    lines.push(
      '📝 *Tu pedido*',
      '',
      order.qty === 1
        ? `1 × ${cfg.product.name} — ${$(q.subtotal)}`
        : `${order.qty} × ${cfg.product.name} (${$(q.unit)} c/u) — ${$(q.subtotal)}`
    );
    if (q.savings > 0) lines.push(`🎉 Ahorras ${$(q.savings)}`);
    lines.push(
      order.method === 'pickup' ? '🏬 Retiro en tienda — GRATIS' : `🚚 Envío LAAR — ${q.shipping ? $(q.shipping) : 'GRATIS 🎉'}`,
      `*Total: ${$(q.total)}*`
    );
    if (order.qty > 1) lines.push('_(Para quitar uno, escribe *quitar*)_');
  }
  lines.push('', ...customerLines(order, cfg));
  return buttons(lines.join('\n'), [
    ['confirm', '✅ Confirmar y pagar'],
    // Subscriptions: switch frequency here. One-time: a cart "+" to take several (no extra question).
    isSub
      ? ['toggle_freq', order.months === 1 ? '📅 Cada 2 meses' : '📅 Mejor cada mes']
      : ['add_one', '➕ Agregar otro'],
    ['edit', '✏️ Corregir'],
  ]);

const M = { plain, productOffer, planOffer, wholesale, askAddress, askSameAddress, askNameConfirm, askName, askCedula, summary, payDeuna, transferInstructions, askReceipt, receiptReceived, stillVerifying, paymentConfirmed, subActivated, subRenewed, trackingSent, renewalReminder, trackingTemplate, askCancelSub, subCancelled, subKept, handoffToHuman, ownerNewPayment, ownerShipDue, ownerRenewalSent, ownerSubCancelled, ownerSubList, ownerHandoffAlert, ownerWholesaleAlert, ownerHelp };

// The sales conversation, as a state machine. Designed for the fewest taps (docs/09-estrategia.md):
//
//   1. OFFER    photo + price                  [¡Lo quiero!] [Pregunta]
//   2. PLAN     the only upsell, right after yes [Comprar] [⭐ Club] [💎 Anual]   (or type a number)
//   3. ADDRESS  "ciudad y dirección" in one message, or [🏬 Retiro]  (returning customer: [✅ Misma])
//   4. NAME     one tap if the WhatsApp profile name looks real       (returning customer: skipped)
//   5. CEDULA   only for delivery                                      (returning customer: skipped)
//   6. SUMMARY  [✅ Confirmar y pagar] [➕ Agregar otro | 📅 frecuencia] [✏️ Corregir]
//   7. PAY      DeUna QR straight away, [🏦 Transferencia] one tap away -> receipt photo
//   8. VERIFYING until you reply "pagado AZ123"
//
//   Club Azul: before each delivery the customer gets a renewal reminder (template) -> pays.
//   Plan Anual: paid once; before each delivery YOU get "toca enviar"; at the end it asks to renew.
//
// This file never talks to WhatsApp directly. It returns outgoing messages ({ to, msg })
// and the server sends them. That keeps it easy to test (test/flow.test.js).





const S = {
  START: 'START',
  OFFER: 'OFFER',
  PLAN: 'PLAN',
  ADDRESS: 'ADDRESS',
  NAME: 'NAME',
  CEDULA: 'CEDULA',
  SUMMARY: 'SUMMARY',
  PAY: 'PAY',
  VERIFYING: 'VERIFYING',
  SUB_CANCEL: 'SUB_CANCEL',
  HUMAN: 'HUMAN',
};

const newSession = (phone) => ({ phone, state: S.START, order: {} });

// Start over but keep who the customer is, which ad brought them and their profile name.
const KEEP = ['adId', 'profileName', 'lastInboundAt'];
const resetSession = (session, phone = session.phone) => {
  for (const key of Object.keys(session)) if (!KEEP.includes(key)) delete session[key];
  Object.assign(session, newSession(phone));
};

const norm = (s = '') =>
  s
    .toLowerCase()
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .trim();

// Accept a tapped button id OR something the person typed that means the same.
const pick = (incoming, options) => {
  const id = incoming.buttonId;
  if (id && options[id]) return id;
  const text = norm(incoming.text);
  if (!text) return null;
  for (const [key, pattern] of Object.entries(options)) {
    if (pattern.test(text)) return key;
  }
  return null;
};

const YES = /^(si|sii+|sip|ok|okay|dale|claro|de una|lo quiero|quiero|me interesa|va|listo|confirmo|correcto)\b/;
const NO = /^(no|nop|nel|todavia no|aun no)\b/;
const WANTS_HUMAN = /\b(asesor|asesora|humano|persona|ayuda|hablar con alguien)\b/;
const RESTART = /^(reiniciar|empezar|menu|inicio)$/;
const CANCEL_SUB = /^cancelar( mi| la)?( suscripcion| club| plan)?$/;
const WINDOW_MS = 23 * 60 * 60 * 1000; // WhatsApp's free-form window is 24 h; keep a margin

// A profile name is worth offering only if it looks like "Nombre Apellido".
const looksLikeName = (s = '') => /^[\p{L}][\p{L}'.-]+(\s+[\p{L}][\p{L}'.-]+)+$/u.test(s.trim());

const totals = (order, cfg) => quote(order.qty ?? 1, order.method, cfg);

const shortId = (prefix) =>
  prefix + Date.now().toString(36).slice(-4).toUpperCase() + Math.floor(Math.random() * 10);
const newOrderId = () => shortId('AZ');
const newSubId = () => shortId('SUB');

const activeSub = (store, phone) =>
  store?.listSubscriptions?.().find((s) => s.phone === phone && s.status === 'active' && s.renew !== false);

// Outside the 24 h window WhatsApp only accepts templates.
const inWindow = (store, phone, now) => {
  const last = store.getSession(phone)?.lastInboundAt;
  return Boolean(last) && now - last < WINDOW_MS;
};

/**
 * @param session  the customer's saved session (mutated and returned)
 * @param incoming { text?, buttonId?, imageId?, referral?, profileName? }
 * @param ctx      { config, store }
 * @returns {{ session, out: Array<{to:string,msg:object}> }}
 */
function handleCustomer(session, incoming, { config: cfg, store, now = Date.now() }) {
  const out = [];
  const reply = (...msgs) => msgs.forEach((msg) => out.push({ to: session.phone, msg }));
  const notifyOwner = (...msgs) =>
    cfg.ownerPhone && msgs.forEach((msg) => out.push({ to: cfg.ownerPhone, msg }));
  const go = (state) => (session.state = state);
  const text = (incoming.text ?? '').trim();
  const btn = incoming.buttonId ?? '';
  const order = () => session.order;
  const isSub = () => order().kind === 'subscription';
  const customer = () => store?.getCustomer?.(session.phone);

  session.lastInboundAt = now;
  if (incoming.profileName) session.profileName = incoming.profileName;
  if (incoming.referral && !session.adId) session.adId = incoming.referral.source_id;

  const toHuman = (msg = M.handoffToHuman(), alert = M.ownerHandoffAlert(session)) => {
    go(S.HUMAN);
    reply(msg);
    notifyOwner(alert);
  };

  // --- Step helpers (each one asks the next missing thing) ---
  const askForAddress = () => {
    const known = customer();
    if (known?.address && !session.forceNewAddress) reply(M.askSameAddress(known, order()));
    else reply(M.askAddress(order(), cfg));
    go(S.ADDRESS);
  };
  const askForCedulaOrSummary = () => {
    if (order().method === 'delivery' && cfg.askCedula !== false && !order().cedula) {
      reply(M.askCedula());
      go(S.CEDULA);
    } else {
      reply(M.summary(order(), cfg));
      go(S.SUMMARY);
    }
  };
  const askForName = () => {
    const known = customer();
    if (known?.name && !session.forceNewAddress) {
      order().name = known.name;
      if (order().method === 'delivery' && known.cedula) order().cedula = known.cedula;
      return askForCedulaOrSummary();
    }
    reply(looksLikeName(session.profileName) ? M.askNameConfirm(session.profileName) : M.askName());
    go(S.NAME);
  };
  const choosePlan = (plan, qty = 1) => {
    session.order =
      plan === 'single'
        ? { kind: 'one-time', qty }
        : { kind: 'subscription', plan, months: cfg.subscription.defaultMonths, qty: 1, method: 'delivery' };
    askForAddress();
  };

  // --- Global shortcuts that work at any step ---
  if (RESTART.test(norm(text))) {
    resetSession(session);
  } else if (session.state === S.HUMAN) {
    return { session, out }; // a person is handling this chat; the bot stays quiet
  } else if (WANTS_HUMAN.test(norm(text))) {
    toHuman();
    return { session, out };
  }

  // Renewal reminder buttons ("Pagar" / "Cancelar suscripción")
  if (btn.startsWith('sub_pay_')) {
    const sub = store.findSubscription(btn.slice('sub_pay_'.length));
    if (!sub || sub.status !== 'active') {
      reply(M.plain('No encontré una suscripción activa 🤔 Escribe *asesor* y te ayudamos.'));
      return { session, out };
    }
    session.order = {
      id: newOrderId(),
      kind: 'subscription',
      plan: sub.plan,
      subId: sub.id,
      renewal: true,
      months: sub.months,
      deliveries: sub.deliveries,
      qty: 1,
      method: 'delivery',
      name: sub.name,
      cedula: sub.cedula,
      city: sub.city,
      address: sub.address,
      unit: sub.unit,
      subtotal: sub.price,
      savings: 0,
      shipping: 0,
      total: sub.price,
      phone: session.phone,
      paymentMethod: 'deuna',
      status: 'awaiting_payment',
      createdAt: new Date(now).toISOString(),
    };
    store.saveOrder(session.order);
    reply(M.payDeuna(session.order, cfg));
    go(S.PAY);
    return { session, out };
  }
  const sub = activeSub(store, session.phone);
  if (sub && session.state !== S.SUB_CANCEL && (btn.startsWith('sub_cancel_') || CANCEL_SUB.test(norm(text)))) {
    reply(M.askCancelSub(sub));
    go(S.SUB_CANCEL);
    return { session, out };
  }

  switch (session.state) {
    case S.START: {
      reply(M.productOffer(cfg));
      go(S.OFFER);
      break;
    }

    case S.OFFER: {
      const c = pick(incoming, { yes: YES, question: /^(no|pregunta|tengo una pregunta)/ });
      if (c === 'yes') {
        reply(M.planOffer(cfg));
        go(S.PLAN);
      } else if (c === 'question') {
        toHuman();
      } else {
        reply(M.productOffer(cfg));
      }
      break;
    }

    case S.PLAN: {
      const c = pick(incoming, {
        plan_annual: /(anual|ano|año)/,
        plan_club: /(club|suscri|mensual)/,
        plan_single: /^(comprar|compra|solo|uno|este|1 cuaderno)/,
      });
      const typedQty = Number.parseInt(text.match(/\d+/)?.[0] ?? '', 10);
      if (c === 'plan_annual' && cfg.subscription.annualPrice > 0) {
        choosePlan('annual');
      } else if (c === 'plan_club') {
        choosePlan('club');
      } else if (c === 'plan_single') {
        choosePlan('single');
      } else if (typedQty > cfg.maxQty) {
        session.order = { kind: 'one-time', qty: typedQty };
        toHuman(M.wholesale(typedQty), M.ownerWholesaleAlert(session, typedQty));
      } else if (typedQty >= 1) {
        choosePlan('single', typedQty);
      } else {
        reply(M.planOffer(cfg, true));
      }
      break;
    }

    case S.ADDRESS: {
      const known = customer();
      // Anchored patterns: a typed address like "frente a la tienda Tía" must not count as pickup.
      const c = pick(incoming, {
        pickup: /^(retiro|retirar|prefiero retirar|lo retiro|paso a retirar|en (la )?tienda|tienda|recoger)\b/,
        same_address: /^(si|sii|ok|dale|claro|a esa|la misma|misma)\b/,
        other_address: /^(otra|otra direccion|no)\b/,
      });
      if (c === 'pickup' && !isSub()) {
        order().method = 'pickup';
        askForName();
      } else if (c === 'same_address' && known?.address && !session.forceNewAddress) {
        Object.assign(order(), { method: 'delivery', address: known.address, city: known.city });
        askForName();
      } else if (c === 'other_address') {
        session.forceNewAddress = true;
        reply(M.askAddress(order(), cfg));
      } else if (text.length >= 12 && !c) {
        Object.assign(order(), { method: 'delivery', address: text, city: text.split(/[,\n]/)[0].trim() });
        askForName();
      } else {
        reply(M.askAddress(order(), cfg, true));
      }
      break;
    }

    case S.NAME: {
      const c = pick(incoming, { name_ok: YES, name_other: /^(otro|otro nombre|no)$/ });
      if (c === 'name_ok' && looksLikeName(session.profileName)) {
        order().name = session.profileName;
        askForCedulaOrSummary();
      } else if (c === 'name_other') {
        reply(M.askName());
      } else if (text.length >= 3 && !c) {
        order().name = text;
        askForCedulaOrSummary();
      } else {
        reply(M.askName(true));
      }
      break;
    }

    case S.CEDULA: {
      const digits = text.replace(/\D/g, '');
      if (!/^\d{10}(\d{3})?$/.test(digits)) {
        reply(M.askCedula(true));
        break;
      }
      order().cedula = digits;
      reply(M.summary(order(), cfg));
      go(S.SUMMARY);
      break;
    }

    case S.SUMMARY: {
      const c = pick(incoming, {
        toggle_freq: /(cada mes|cada 2 meses|cada dos meses|mensual|bimestral)/,
        add_one: /^(agregar|otro|uno mas|mas|\+)/,
        remove_one: /^(quitar|uno menos|menos|-)/,
        confirm: YES,
        edit: /(corregir|cambiar|editar|no)/,
      });
      if (c === 'toggle_freq' && isSub()) {
        order().months = order().months === 1 ? 2 : 1;
        reply(M.summary(order(), cfg));
      } else if (c === 'add_one' && !isSub()) {
        if (order().qty >= cfg.maxQty) {
          toHuman(M.wholesale(order().qty + 1), M.ownerWholesaleAlert(session, order().qty + 1));
          break;
        }
        order().qty += 1;
        reply(M.summary(order(), cfg));
      } else if (c === 'remove_one' && !isSub() && order().qty > 1) {
        order().qty -= 1;
        reply(M.summary(order(), cfg));
      } else if (c === 'confirm') {
        const base = {
          id: order().id ?? newOrderId(),
          phone: session.phone,
          adId: session.adId,
          paymentMethod: 'deuna',
          status: 'awaiting_payment',
          createdAt: new Date(now).toISOString(),
        };
        if (isSub()) {
          const p = planQuote(order().plan, order().months, cfg);
          const newSub = {
            id: order().subId ?? newSubId(),
            phone: session.phone,
            plan: order().plan,
            months: order().months,
            deliveries: p.deliveries, // notebooks covered by each payment
            unit: p.unit,
            price: p.total, // what each payment costs
            name: order().name,
            cedula: order().cedula,
            city: order().city,
            address: order().address,
            status: 'pending_payment',
            renew: true,
            createdAt: base.createdAt,
          };
          store?.saveSubscription(newSub);
          Object.assign(order(), base, {
            subId: newSub.id,
            deliveries: p.deliveries,
            unit: p.unit,
            subtotal: p.total,
            savings: p.savings,
            shipping: 0,
            total: p.total,
          });
        } else {
          Object.assign(order(), totals(order(), cfg), base);
        }
        store?.saveOrder(order());
        store?.saveCustomer?.({
          phone: session.phone,
          name: order().name,
          ...(order().cedula ? { cedula: order().cedula } : {}),
          ...(order().method === 'delivery' ? { address: order().address, city: order().city } : {}),
        });
        delete session.forceNewAddress;
        reply(M.payDeuna(order(), cfg));
        go(S.PAY);
      } else if (c === 'edit') {
        const { kind, plan, months, qty } = order();
        session.order = { kind, plan, months, qty, ...(kind === 'subscription' ? { method: 'delivery' } : {}) };
        session.forceNewAddress = true;
        reply(M.askAddress(order(), cfg));
        go(S.ADDRESS);
      } else {
        reply(M.summary(order(), cfg));
      }
      break;
    }

    case S.PAY: {
      const c = pick(incoming, { pay_transfer: /(transfer|deposito|banco)/, pay_deuna: /de ?una/ });
      if (incoming.imageId) {
        Object.assign(order(), { status: 'verifying', receiptMediaId: incoming.imageId });
        store?.saveOrder(order());
        reply(M.receiptReceived());
        notifyOwner(
          { type: 'forward_image', mediaId: incoming.imageId, caption: `Comprobante ${order().id}` },
          M.ownerNewPayment(order())
        );
        go(S.VERIFYING);
      } else if (c === 'pay_transfer') {
        order().paymentMethod = 'transferencia';
        store?.saveOrder(order());
        reply(M.transferInstructions(order(), cfg));
      } else if (c === 'pay_deuna') {
        order().paymentMethod = 'deuna';
        store?.saveOrder(order());
        reply(M.payDeuna(order(), cfg));
      } else {
        reply(M.askReceipt());
      }
      break;
    }

    case S.VERIFYING: {
      if (incoming.imageId) {
        notifyOwner({ type: 'forward_image', mediaId: incoming.imageId, caption: `Otra imagen del pedido ${order().id}` });
      }
      reply(M.stillVerifying(order()));
      break;
    }

    case S.SUB_CANCEL: {
      const c = pick(incoming, { sub_cancel_yes: YES, sub_cancel_no: NO });
      const current = activeSub(store, session.phone);
      if (c === 'sub_cancel_yes' && current) {
        // A prepaid annual plan keeps shipping what was paid; it just won't renew.
        if (current.deliveriesLeft > 0) current.renew = false;
        else current.status = 'cancelled';
        current.cancelledAt = new Date(now).toISOString();
        store.saveSubscription(current);
        reply(M.subCancelled(current));
        notifyOwner(M.ownerSubCancelled(current));
        resetSession(session);
      } else if (c === 'sub_cancel_no' || !current) {
        reply(M.subKept());
        resetSession(session);
      } else {
        reply(M.askCancelSub(current));
      }
      break;
    }
  }

  return { session, out };
}

/**
 * Runs every hour (server.js). For each subscription whose next delivery is close:
 *  - prepaid deliveries left (Plan Anual) -> tells YOU to ship it
 *  - nothing left to ship                 -> asks the customer to renew (template)
 */
function subscriptionReminders(today, { config: cfg, store }) {
  const out = [];
  for (const sub of dueForReminder(store.listSubscriptions(), today, cfg.subscription.reminderDaysBefore)) {
    if (sub.deliveriesLeft > 0) {
      if (cfg.ownerPhone) out.push({ to: cfg.ownerPhone, msg: M.ownerShipDue(sub) });
    } else if (sub.renew === false) {
      sub.status = 'ended';
    } else {
      out.push({ to: sub.phone, msg: M.renewalReminder(sub, cfg) });
      if (cfg.ownerPhone) out.push({ to: cfg.ownerPhone, msg: M.ownerRenewalSent(sub) });
    }
    sub.remindedFor = sub.nextShipDate;
    store.saveSubscription(sub);
  }
  return out;
}

const OWNER_COMMANDS = ['pagado', 'guia', 'bot', 'pedidos', 'suscripciones', 'recordar', 'responder', 'comandos'];

// Only messages that start with a command are treated as admin commands, so you
// can still test the customer flow from your own phone.
const isOwnerCommand = (text = '') => OWNER_COMMANDS.includes(norm(text.split(/\s+/)[0]));

/**
 * Commands you send from your own WhatsApp (OWNER_PHONE) to the bot's number. See M.ownerHelp().
 */
function handleOwner(text, { config: cfg, store, today = todayEC(), now = Date.now() }) {
  const out = [];
  const toOwner = (msg) => out.push({ to: cfg.ownerPhone, msg });
  const [cmd, arg1 = '', ...rest] = text.trim().split(/\s+/);
  const resetCustomer = (phone, lastOrderId) => {
    const session = store.getSession(phone);
    if (!session) return;
    resetSession(session, phone);
    if (lastOrderId) session.lastOrderId = lastOrderId;
    store.saveSession(session);
  };

  switch (norm(cmd)) {
    case 'pagado': {
      const order = store.findOrder(arg1);
      if (!order) {
        toOwner(M.plain(`No encontré el pedido ${arg1}`));
        break;
      }
      order.status = 'paid';
      order.paidAt = new Date(now).toISOString();
      store.saveOrder(order);
      const sub = order.subId && store.findSubscription(order.subId);
      if (sub) {
        // This payment covers `deliveries` notebooks; the first one ships now.
        sub.deliveriesLeft = sub.deliveries - 1;
        sub.nextShipDate = addMonths(order.renewal ? sub.nextShipDate : today, sub.months);
        sub.status = 'active';
        sub.lastPaidOrder = order.id;
        store.saveSubscription(sub);
        out.push({ to: order.phone, msg: order.renewal ? M.subRenewed(sub, cfg) : M.subActivated(sub, cfg) });
      } else {
        out.push({ to: order.phone, msg: M.paymentConfirmed(order, cfg) });
      }
      resetCustomer(order.phone, order.id);
      toOwner(M.plain(`✅ ${order.id} marcado como pagado. Cliente notificado.`));
      break;
    }
    case 'guia': {
      const tracking = rest.join(' ');
      const sub = arg1.toUpperCase().startsWith('SUB') && store.findSubscription(arg1);
      const order = !sub && store.findOrder(arg1);
      if ((!sub && !order) || !tracking) {
        toOwner(M.plain('Uso: guia <AZ… o SUB…> <número de guía LAAR>'));
        break;
      }
      let phone, name;
      if (sub) {
        if (!(sub.deliveriesLeft > 0)) {
          toOwner(M.plain(`${sub.id} no tiene envíos prepagados pendientes.`));
          break;
        }
        const n = sub.deliveries - sub.deliveriesLeft + 1;
        sub.deliveriesLeft -= 1;
        sub.nextShipDate = addMonths(sub.nextShipDate, sub.months);
        (sub.shipments ??= []).push({ tracking, at: new Date(now).toISOString() });
        store.saveSubscription(sub);
        ({ phone, name } = sub);
        toOwner(M.plain(`🚚 Cuaderno ${n} de ${sub.deliveries} de ${sub.id} despachado. Cliente notificado.`));
      } else {
        Object.assign(order, { tracking, status: 'shipped' });
        store.saveOrder(order);
        ({ phone, name } = order);
        toOwner(M.plain(`🚚 Guía enviada al cliente de ${order.id}.`));
      }
      out.unshift({
        to: phone,
        msg: inWindow(store, phone, now) ? M.trackingSent({ tracking }) : M.trackingTemplate(name, tracking, cfg),
      });
      break;
    }
    case 'bot': {
      if (!store.getSession(arg1)) {
        toOwner(M.plain(`No encontré chat con ${arg1}`));
        break;
      }
      resetCustomer(arg1);
      toOwner(M.plain(`🤖 El bot vuelve a atender a ${arg1}.`));
      break;
    }
    case 'pedidos': {
      const pending = store.listOrders().filter((o) => o.status === 'verifying');
      toOwner(
        M.plain(
          pending.length
            ? pending
                .map((o) => `${o.id} · ${o.name} · ${o.subId ? o.plan : `${o.qty} cuad.`} · $${o.total.toFixed(2)} · ${o.paymentMethod}`)
                .join('\n')
            : 'No hay pagos por verificar 🙌'
        )
      );
      break;
    }
    case 'suscripciones': {
      toOwner(M.ownerSubList(store.listSubscriptions().filter((s) => s.status === 'active')));
      break;
    }
    case 'recordar': {
      const sub = store.findSubscription(arg1);
      if (!sub || sub.status !== 'active') {
        toOwner(M.plain('Uso: recordar <SUB…> (de una suscripción activa)'));
        break;
      }
      sub.remindedFor = sub.nextShipDate;
      store.saveSubscription(sub);
      out.push({ to: sub.phone, msg: M.renewalReminder(sub, cfg) });
      toOwner(M.ownerRenewalSent(sub));
      break;
    }
    case 'responder': {
      const message = rest.join(' ');
      if (!arg1 || !message) {
        toOwner(M.plain('Uso: responder <número> <mensaje>'));
        break;
      }
      out.push({ to: arg1, msg: M.plain(message) });
      break;
    }
    case 'comandos':
      toOwner(M.ownerHelp());
      break;
  }
  return out;
}

  },
  pricing: parseTiers('1:15'),
  subscription: { clubPrice: 12, annualPrice: 10, defaultMonths: 2, reminderDaysBefore: 3 },
  templates: { renewal: 'recordatorio_suscripcion', shipping: 'envio_en_camino', lang: 'es' },
  freeShippingFrom: 3,
  maxQty: 20,
  shippingCost: 4.5,
  deliveryDays: '1 a 3 días hábiles',
  store: { address: 'Av. Ejemplo N00-00 y Calle Ejemplo, Quito', mapsUrl: 'https://maps.google.com/?q=Quito', hours: 'Lunes a sábado, 10:00 a 19:00' },
  deunaQrUrl: '',
  deunaPhone: '0990000000',
  bank: { name: 'Banco Pichincha', accountType: 'Ahorros', accountNumber: '2200000000', holder: 'Tu nombre', holderId: '1700000000', email: '' },
};
const CUSTOMER = '593981234567';

/* ---- In-memory store ---- */
const sessions = {}, orders = {}, subs = {}, customers = {};
const store = {
  getSession: (p) => sessions[p],
  saveSession: (s) => { sessions[s.phone] = s; },
  findOrder: (id = '') => orders[id.toUpperCase()],
  listOrders: () => Object.values(orders),
  saveOrder: (o) => { orders[o.id] = { ...o }; },
  getCustomer: (p) => customers[p],
  saveCustomer: (c) => { customers[c.phone] = { ...customers[c.phone], ...c }; },
  findSubscription: (id = '') => subs[id.toUpperCase()],
  listSubscriptions: () => Object.values(subs),
  saveSubscription: (s) => { subs[s.id] = { ...s }; },
};
let session = newSession(CUSTOMER);
store.saveSession(session);

/* ---- UI ---- */
const byId = (id) => document.getElementById(id);
const chats = { customer: byId('chat-customer'), owner: byId('chat-owner') };
let view = 'customer';
let unread = 0;

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const format = (s) =>
  esc(s)
    .replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>')
    .replace(/~([^~\n]+)~/g, '<s>$1</s>')
    .replace(/(^|\s)_([^_\n]+)_(?=\s|$)/g, '$1<em>$2</em>')
    .replace(/(https?:\/\/[^\s<]+|wa\.me\/\d+)/g, (u) => `<a href="${u.startsWith('http') ? u : 'https://' + u}" target="_blank" rel="noopener">${u}</a>`);
const now = () => new Date().toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' });

function scroll(el) { el.scrollTop = el.scrollHeight; }

function addBubble(where, dir, html, buttons, listButton) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${dir}`;
  const head = listButton ? `<div class="list-head">☰ ${esc(listButton)}</div>` : '';
  wrap.innerHTML = `<div class="bubble">${html}<span class="time">${now()}</span>${head}</div>`;
  if (buttons?.length) {
    const b = document.createElement('div');
    b.className = listButton ? 'btns rows' : 'btns';
    for (const btn of buttons) {
      const el = document.createElement('button');
      el.type = 'button';
      if (btn.description !== undefined) {
        el.innerHTML = `<span class="r-title">${esc(btn.title)}</span><span class="r-desc">${esc(btn.description)}</span>`;
        if (/Recomendado/.test(btn.description)) el.classList.add('pick');
      } else {
        el.textContent = btn.title;
      }
      el.addEventListener('click', () => {
        b.querySelectorAll('button').forEach((x) => (x.disabled = true));
        customerSends({ buttonId: btn.id, text: btn.title }, btn.title);
      });
      b.appendChild(el);
    }
    wrap.appendChild(b);
  }
  chats[where].appendChild(wrap);
  scroll(chats[where]);
}

function render(where, msg) {
  if (msg.type === 'forward_image') {
    addBubble(where, 'in', `<div class="receipt">📷 comprobante</div>${format(msg.caption)}`);
  } else if (msg.type === 'image') {
    addBubble(where, 'in', `<img src="${esc(msg.link)}" alt="">${format(msg.caption || '')}`);
  } else if (msg.type === 'template') {
    addBubble(where, 'in', `<div class="tpl-tag">🔔 Recordatorio automático</div>${format(msg.text)}`, msg.buttons);
  } else if (msg.type === 'list') {
    addBubble(where, 'in', format(msg.text), msg.rows, msg.button);
  } else if (msg.type === 'buttons') {
    const img = msg.headerImage ? `<img src="${esc(msg.headerImage)}" alt="El Cuaderno Azul">` : '';
    addBubble(where, 'in', img + format(msg.text), msg.buttons);
  } else {
    addBubble(where, 'in', format(msg.text));
  }
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function deliver(out) {
  for (const { to, msg } of out) {
    const where = to === config.ownerPhone ? 'owner' : 'customer';
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    chats[where].appendChild(typing);
    scroll(chats[where]);
    await sleep(where === view ? 550 : 150);
    typing.remove();
    render(where, msg);
    if (where === 'owner' && view !== 'owner') { unread++; updateBadge(); }
  }
  updateHints();
}

let busy = false;
async function customerSends(incoming, shown) {
  if (busy) return;
  busy = true;
  addBubble('customer', 'out', shown);
  // In WhatsApp the customer's profile name arrives with each message.
  const r = handleCustomer(session, { profileName: 'María Pérez', ...incoming }, { config, store });
  session = r.session;
  store.saveSession(session);
  await deliver(r.out);
  busy = false;
}

async function ownerSends(text) {
  if (busy) return;
  busy = true;
  addBubble('owner', 'out', format(text));
  const out = isOwnerCommand(text)
    ? handleOwner(text, { config, store })
    : [{ to: config.ownerPhone, msg: plain('Escribe un comando. Toca "comandos" para ver la lista.') }];
  session = store.getSession(CUSTOMER) ?? session;
  await deliver(out);
  busy = false;
}

function updateBadge() {
  byId('badge').hidden = unread === 0;
  byId('badge').textContent = unread;
}

function setView(v) {
  view = v;
  byId('tab-customer').setAttribute('aria-selected', v === 'customer');
  byId('tab-owner').setAttribute('aria-selected', v === 'owner');
  chats.customer.hidden = v !== 'customer';
  chats.owner.hidden = v !== 'owner';
  byId('photo').hidden = v !== 'customer';
  byId('input').placeholder = v === 'customer' ? 'Escribe como cliente' : 'Escribe un comando';
  byId('sub').textContent = v === 'customer' ? 'bot de ventas · demo' : 'tu WhatsApp personal · demo';
  if (v === 'owner') { unread = 0; updateBadge(); }
  updateHints();
  scroll(chats[v]);
}

function hint(label, action) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = label;
  b.addEventListener('click', action);
  return b;
}

function updateHints() {
  const h = byId('hints');
  h.replaceChildren();
  const say = (label, text = label) => h.append(hint(label, () => customerSends({ text }, esc(text))));
  if (view === 'customer') {
    if (session.state === 'PAY') h.append(hint('📷 Enviar comprobante', sendPhoto));
    if (session.state === 'PLAN') say('Quiero 3', 'quiero 3');
    if (session.state === 'ADDRESS') say('Usar dirección de ejemplo', 'Quito, Av. Amazonas N34 y Rusia, casa azul frente al parque');
    if (session.state === 'NAME') say('María Pérez');
    if (session.state === 'CEDULA') say('1712345678');
    if (session.state === 'SUMMARY' && session.order.qty > 1 && session.order.kind !== 'subscription') say('quitar');
    if (session.state !== 'HUMAN' && session.state !== 'START') say('asesor');
    if (session.state === 'HUMAN') say('reiniciar');
  } else {
    for (const o of store.listOrders().filter((o) => o.status === 'verifying'))
      h.append(hint(`pagado ${o.id}`, () => ownerSends(`pagado ${o.id}`)));
    for (const o of store.listOrders().filter((o) => o.status === 'paid' && o.method === 'delivery'))
      h.append(hint(`guia ${o.id} 0012345`, () => ownerSends(`guia ${o.id} 0012345`)));
    for (const s of store.listSubscriptions().filter((s) => s.status === 'active')) {
      if (s.deliveriesLeft > 0 && s.remindedFor === s.nextShipDate)
        h.append(hint(`guia ${s.id} 0067890`, () => ownerSends(`guia ${s.id} 0067890`)));
      else h.append(hint('⏩ Saltar al próximo envío', () => simulateReminder(s)));
    }
    if (store.listSubscriptions().length) h.append(hint('suscripciones', () => ownerSends('suscripciones')));
    if (session.state === 'HUMAN') {
      h.append(hint('responder…', () => ownerSends(`responder ${CUSTOMER} ¡Hola! Te ayudo por aquí 😊`)));
      h.append(hint(`bot ${CUSTOMER}`, () => ownerSends(`bot ${CUSTOMER}`)));
    }
    h.append(hint('pedidos', () => ownerSends('pedidos')), hint('comandos', () => ownerSends('comandos')));
  }
  h.hidden = h.children.length === 0;
}

// Demo only: pretend time passed until 3 days before the next delivery.
async function simulateReminder(sub) {
  if (busy) return;
  busy = true;
  const [y, m, d] = sub.nextShipDate.split('-').map(Number);
  const day = new Date(Date.UTC(y, m - 1, d - config.subscription.reminderDaysBefore)).toISOString().slice(0, 10);
  addBubble('owner', 'out', `⏩ <em>Pasa el tiempo… hoy es ${formatDate(day)}</em>`);
  const out = subscriptionReminders(day, { config, store });
  await deliver(out);
  busy = false;
  // Plan Anual: only you get "toca enviar". Club: the customer gets the renewal reminder.
  if (out.some((o) => o.to === CUSTOMER)) setView('customer');
}

function sendPhoto() {
  customerSends({ imageId: 'DEMO_' + Date.now() }, '<div class="receipt">📷 comprobante</div>');
}

byId('photo').addEventListener('click', sendPhoto);
byId('tab-customer').addEventListener('click', () => setView('customer'));
byId('tab-owner').addEventListener('click', () => setView('owner'));
byId('compose').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = byId('input').value.trim();
  if (!text) return;
  byId('input').value = '';
  if (view === 'customer') customerSends({ text }, esc(text));
  else ownerSends(text);
});
byId('reset').addEventListener('click', () => {
  for (const k of Object.keys(orders)) delete orders[k];
  for (const k of Object.keys(subs)) delete subs[k];
  for (const k of Object.keys(customers)) delete customers[k];
  session = newSession(CUSTOMER);
  store.saveSession(session);
  for (const c of Object.values(chats)) c.querySelectorAll('.msg, .typing').forEach((m) => m.remove());
  unread = 0; updateBadge();
  setView('customer');
  start();
});

function start() {
  customerSends({ text: '¡Hola! Quiero el cuaderno azul 💙', referral: { source_id: 'DEMO_AD' } }, '¡Hola! Quiero el cuaderno azul 💙');
}
setView('customer');
start();
</script>
